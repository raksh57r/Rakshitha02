<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    .calculator {
      width: 320px;
      background: #222;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }
    #display {
      width: 100%;
      height: 60px;
      background: #000;
      color: #0f0;
      text-align: right;
      font-size: 32px;
      border: none;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    button {
      padding: 20px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover {
      background: #555;
    }
    .operator {
      background: #ff9500;
    }
    .operator:hover {
      background: #ffa733;
    }
    .equal {
      background: #28a745;
    }
    .equal:hover {
      background: #3ec15a;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" id="display" disabled />
    <div class="buttons">
      <button onclick="clearDisplay()">C</button>
      <button onclick="del()">DEL</button>
      <button class="operator" onclick="addToDisplay('/')">÷</button>
      <button class="operator" onclick="addToDisplay('*')">×</button><button onclick="addToDisplay('7')">7</button>
  <button onclick="addToDisplay('8')">8</button>
  <button onclick="addToDisplay('9')">9</button>
  <button class="operator" onclick="addToDisplay('-')">−</button>

  <button onclick="addToDisplay('4')">4</button>
  <button onclick="addToDisplay('5')">5</button>
  <button onclick="addToDisplay('6')">6</button>
  <button class="operator" onclick="addToDisplay('+')">+</button>

  <button onclick="addToDisplay('1')">1</button>
  <button onclick="addToDisplay('2')">2</button>
  <button onclick="addToDisplay('3')">3</button>
  <button class="equal" onclick="calculate()">=</button>

  <button onclick="addToDisplay('0')" style="grid-column: span 2">0</button>
  <button onclick="addToDisplay('.')">.</button>
</div>

  </div>  <script>
    let display = document.getElementById('display');

    function addToDisplay(value) {
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function del() {
      display.value = display.value.slice(0, -1);
    }

    function calculate() {
      try {
        display.value = eval(display.value);
      } catch {
        display.value = 'Error';
      }
    }
  </script></body>
</html>
